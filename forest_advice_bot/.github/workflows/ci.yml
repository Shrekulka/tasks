name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        # версия образа та же, что в docker-compose.yml
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # без этой переменной интеграционные тесты пропускаются (см. tests/conftest.py)
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # CPU-версия torch ставится первой, как в Dockerfile: без этого pip тянет CUDA-сборку на
      # несколько гигабайт. Модель e5 тестам не нужна (используется fake_embedder), но все
      # зависимости ставятся те же, что в образе
      - run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m scripts.gen_config_docs --check
      - run: pytest -q

  # T1: чистый клон собирается и поднимается одной командой. Тесты этого не проверяют, поэтому
  # отдельное задание: сборка образа (CPU torch, модель e5 с Hugging Face) и запуск db. Сервис bot не
  # стартует: ему нужны настоящие токены Telegram и OpenRouter, которых в CI нет.
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
      - name: db поднимается и становится healthy
        run: |
          docker compose up -d db
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q db)")
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker compose logs db
          exit 1
